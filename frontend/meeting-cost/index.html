<body class="w3-light-grey">
  <div class="w3-container w3-padding-large w3-card w3-margin-top" style="max-width: 440px; margin-left: auto; margin-right: auto;">
    <a href="../index.html" class="w3-text-blue" style="text-decoration: none;">← Back</a>
    <h1>Meeting Cost</h1>
    <p class="w3-text-grey" style="margin-top: 0;">Watch the money burn, live.</p>

    <div class="w3-row-padding" style="margin: 0 -8px;">
      <div class="w3-half">
        <label for="people">People</label>
        <input id="people" type="number" min="1" value="5" class="w3-input w3-border w3-round" />
      </div>
      <div class="w3-half">
        <label for="rate">Avg hourly rate</label>
        <input id="rate" type="number" min="0" step="0.5" value="60" class="w3-input w3-border w3-round" />
      </div>
    </div>

    <div class="w3-panel w3-white w3-round w3-border w3-center w3-margin-top" style="padding: 24px 16px;">
      <div id="cost" style="font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums;">€0.00</div>
      <div id="elapsed" class="w3-text-grey" style="font-variant-numeric: tabular-nums;">0:00:00</div>
      <div id="burn" class="w3-text-grey w3-small" style="margin-top: 4px;">€5.00 / minute</div>
    </div>

    <div class="w3-center" style="margin-top: 12px;">
      <button id="start-btn" class="w3-button w3-blue w3-round w3-large">Start</button>
      <button id="pause-btn" class="w3-button w3-orange w3-round w3-large" style="display: none;">Pause</button>
      <button id="reset-btn" class="w3-button w3-border w3-round" style="display: none;">Reset</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
