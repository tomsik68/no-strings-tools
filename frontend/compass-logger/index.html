<body class="w3-light-grey">
  <main class="w3-container w3-padding-large w3-card w3-margin-top w3-white" style="max-width: 480px; margin-left: auto; margin-right: auto;">
    <a href="../" onclick="if(location.protocol==='file:'){location.href='../index.html';return false}" class="w3-text-blue" style="text-decoration: none;">← Back</a>
    <h1>Compass Logger</h1>
    <p class="w3-text-grey" style="margin-top: 0;">Log compass bearings or record your heading, then export to CSV.</p>

    <div class="w3-panel w3-light-grey w3-round w3-center" style="padding: 20px 16px;">
      <div id="heading" aria-live="off">—°</div>
      <div id="dir" class="w3-large">&nbsp;</div>
      <p id="msg" class="w3-small w3-text-grey" role="status" style="margin-bottom: 0;">Waiting for compass…</p>
      <button id="enable" class="w3-button w3-blue w3-round w3-margin-top" hidden>Enable compass</button>
    </div>

    <label for="note">Note (optional)</label>
    <input id="note" class="w3-input w3-border w3-round" placeholder="e.g. church tower" autocomplete="off" />
    <div class="btn-row w3-margin-top">
      <button id="log-btn" class="w3-button w3-blue w3-round w3-large" disabled>📍 Log bearing</button>
      <button id="rec-btn" class="w3-button w3-red w3-round w3-large" disabled>⏺ Record</button>
    </div>

    <div class="btn-row w3-margin-top" style="align-items: center;">
      <h2 class="w3-large" style="margin: 0; flex: 1;">Log <span id="count">(0)</span></h2>
      <button id="csv" class="w3-button w3-border w3-round w3-small">Export CSV</button>
      <button id="clear" class="w3-button w3-border w3-round w3-small">Clear</button>
    </div>
    <table id="log" class="w3-table w3-bordered w3-small"></table>
    <p id="more" class="w3-small w3-text-grey"></p>

    <section style="margin-top: 32px; padding-top: 16px; border-top: 1px solid #ddd;">

        <a href="../light-detector/" class="w3-text-blue" style="text-decoration: none;">Light Meter (Lux)</a>
      </p>
    </section>
