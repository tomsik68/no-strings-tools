  <style>
    .card { max-width: 560px; margin: 0 auto; }
    .vax-card {
      background: white; border-radius: 8px; padding: 14px 16px;
      margin-bottom: 10px; border: 1px solid #eee;
    }
    .vax-top { display: flex; align-items: center; gap: 10px; }
    .vax-name { flex: 1; font-size: 15px; font-weight: 600; color: #222; }
    .status-badge {
      font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 12px;
      white-space: nowrap; flex-shrink: 0;
    }
    .status-badge.overdue { background: #fde8e8; color: #c62828; }
    .status-badge.soon { background: #fff3e0; color: #e65100; }
    .status-badge.ok { background: #e8f5e9; color: #2e7d32; }
    .vax-del { background: none; border: none; color: #ddd; cursor: pointer; font-size: 18px; padding: 0 2px; line-height: 1; flex-shrink: 0; }
    .vax-del:hover { color: #f44336; }
    .vax-meta { font-size: 12px; color: #aaa; margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
    .log-btn {
      margin-top: 10px; font-size: 12px; padding: 5px 12px; border-radius: 5px;
      border: 1px solid #4caf50; color: #388e3c; background: white; cursor: pointer;
      font-family: inherit;
    }
    .log-btn:hover { background: #e8f5e9; }
    .add-form { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: #888; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .field input, .field select { padding: 9px 11px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; font-family: inherit; background: white; }
    .field input:focus, .field select:focus { outline: none; border-color: #1976d2; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-row-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
    @media (max-width: 420px) { .form-row, .form-row-3 { grid-template-columns: 1fr; } }
    .add-row { display: flex; justify-content: flex-end; }
    .empty { text-align: center; color: #bbb; padding: 32px 0; font-size: 14px; }
  </style>
</head>
<body class="w3-light-grey">
  <div class="w3-container w3-padding-large card w3-card w3-margin-top">
    <a href="../index.html" class="w3-text-blue" style="text-decoration: none;">← Back</a>
    <h1>💉 Vaccination Tracker</h1>
    <p class="w3-text-grey w3-small">Track all your vaccinations with flexible reminders. Set any interval in days, months or years.</p>

    <div id="vax-list"></div>

    <div class="add-form">
      <div class="field">
        <label for="new-name">Vaccine name</label>
        <input id="new-name" type="text" list="vaccine-suggestions" placeholder="e.g. COVID-19" autocomplete="off" />
        <datalist id="vaccine-suggestions">
          <option>COVID-19</option>
          <option>Flu</option>
          <option>Tetanus</option>
          <option>Measles</option>
          <option>Polio</option>
          <option>Whooping Cough</option>
          <option>Hepatitis A</option>
          <option>Hepatitis B</option>
          <option>Yellow Fever</option>
          <option>Chickenpox</option>
          <option>Shingles</option>
          <option>Pneumonia</option>
          <option>HPV</option>
          <option>Meningitis</option>
        </datalist>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="last-dose">Last dose date</label>
          <input id="last-dose" type="date" />
        </div>
        <div class="field">
          <label for="dose-number">Dose number</label>
          <input id="dose-number" type="text" placeholder="e.g. 1, 2, 3..." />
        </div>
      </div>
      <div class="field">
        <label>Next dose in</label>
        <div class="form-row-3">
          <div class="field" style="margin: 0;">
            <input id="interval-value" type="number" min="1" placeholder="e.g. 6" />
          </div>
          <div class="field" style="margin: 0;">
            <select id="interval-unit">
              <option value="days">Days</option>
              <option value="months" selected>Months</option>
              <option value="years">Years</option>
            </select>
          </div>
          <div style="font-size: 12px; color: #888; text-transform: uppercase; font-weight: 700; letter-spacing: .04em; display: flex; align-items: flex-end; padding-bottom: 9px;">From last dose</div>
        </div>
      </div>
      <div class="add-row">
        <button id="add-btn" class="w3-button w3-blue w3-round">Add Vaccination</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
